# Reconstructed from manuscript, NOT original architecture recovered from disk.
# YOLO11m backbone (C3k2, SPPF, C2PSA) + CBAM + SPDConv + DySample + P2 head.
# This models nc=105 exactly as manuscript says; correctness of hierarchical target labeling
# MUST be resolved before interpreting species-level accuracy.
nc: 105
scale: m
scales:
  m: [0.50, 1.00, 512]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]           #  0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]          #  1 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  #  2 P2 features
  - [-1, 1, SPDConv, [256, 1]]         #  3 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  #  4 P3 features
  - [-1, 1, SPDConv, [512, 1]]         #  5 P4/16
  - [-1, 2, C3k2, [512, True]]         #  6 P4 features
  - [-1, 1, SPDConv, [1024, 1]]        #  7 P5/32
  - [-1, 2, C3k2, [1024, True]]        #  8 P5 features
  - [-1, 1, SPPF, [1024, 5]]           #  9 SPPF
  - [-1, 2, C2PSA, [1024]]             # 10 standard YOLO11 attention retained
  - [-1, 1, PaperCBAM, [7, 16]]        # 11 CBAM between Backbone and Neck
head:
  # FPN: P5 -> P4 -> P3 -> P2
  - [-1, 1, DySample, [2, 4]]          # 12 P5 -> P4
  - [[-1, 6], 1, Concat, [1]]          # 13
  - [-1, 2, C3k2, [512, False]]       # 14 P4 top-down
  - [-1, 1, DySample, [2, 4]]          # 15 P4 -> P3
  - [[-1, 4], 1, Concat, [1]]          # 16
  - [-1, 2, C3k2, [256, False]]       # 17 P3 top-down
  - [-1, 1, DySample, [2, 4]]          # 18 P3 -> P2
  - [[-1, 2], 1, Concat, [1]]          # 19
  - [-1, 2, C3k2, [128, False]]       # 20 P2 output (stride 4)
  # PAN: P2 -> P3 -> P4 -> P5
  - [-1, 1, SPDConv, [128, 1]]         # 21 downsample
  - [[-1, 17], 1, Concat, [1]]         # 22
  - [-1, 2, C3k2, [256, False]]       # 23 P3 output (stride 8)
  - [-1, 1, SPDConv, [256, 1]]         # 24
  - [[-1, 14], 1, Concat, [1]]         # 25
  - [-1, 2, C3k2, [512, False]]       # 26 P4 output (stride 16)
  - [-1, 1, SPDConv, [512, 1]]         # 27
  - [[-1, 11], 1, Concat, [1]]         # 28
  - [-1, 2, C3k2, [1024, True]]       # 29 P5 output (stride 32)
  - [[20, 23, 26, 29], 1, Detect, [nc]] # 30
